name: Build and Test

on:
  push:
  pull_request:
    branches: [ main, master ]

jobs:
  # -----------------------------------------------------------------
  # Fast, standalone style gate. Only needs the source tree under src/
  # and clang-format -- no MSVC toolchain, no deps, no submodules -- so
  # it runs on Linux in well under a minute and is independent of the
  # Windows build job below.
  #
  # The clang-format version is PINNED to match the copy bundled with
  # Visual Studio 2022 (19.1.x). clang-format output changes between
  # major versions, so local and CI must agree or a locally-formatted
  # file could still fail here. cmake -P runs the exact same script that
  # backs the local `format-check` target (cmake/RunClangFormat.cmake).
  # -----------------------------------------------------------------
  format-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Install pinned clang-format
        run: pipx install clang-format==19.1.5

      - name: Check source formatting
        run: cmake -P cmake/RunClangFormat.cmake -- --check

  # -----------------------------------------------------------------
  # Translation gate. Volunteers edit the gettext catalogs under
  # localization/ and never the JSON tables under resources/, so this
  # job verifies that the committed tables are exactly what the
  # generator produces from those catalogs, and that every string still
  # passes the loader's rules (no "##", printf specifiers matching
  # English). The CDN serves resources/localization straight off main,
  # so a merged typo reaches installed builds within a day and this is
  # the only gate in front of it. Like the format job it needs nothing
  # but the source tree, so a contributor gets an answer in under a
  # minute instead of waiting on the Windows build below.
  #
  # Glyph coverage is deliberately NOT checked here. The baked font
  # ranges live in MkGuiTheme, and localization_test_glyph_coverage in
  # the Windows job owns that check rather than a second copy of the
  # range table drifting in Python.
  # -----------------------------------------------------------------
  localization-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Install polib
        run: pip install polib

      - name: Check localization tables
        run: python tools/localization.py check

  # -----------------------------------------------------------------
  # The AI usage badges are rendered from docs/ai-usage.json, which is
  # committed. Collecting into that ledger needs the Claude Code
  # transcripts on the developer's machine, so it cannot happen here,
  # but re-rendering from the ledger is a pure function of files in the
  # repo. This job re-renders and fails if the published badges or
  # TOKEN_STATS.md have drifted from the ledger. No toolchain, no
  # secrets, seconds long.
  # -----------------------------------------------------------------
  ai-usage-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Check AI usage badges against the ledger
        run: python tools/token_stats.py --check

  build:
    runs-on: windows-2022

    # Enable the sccache GitHub Actions cache backend for the whole job.
    # sccache runs as a background server whose storage backend is fixed
    # by the first invocation that starts it, so this must be visible to
    # every step (configure, builds, stats) — not just the build steps —
    # otherwise the server can pin to local disk and nothing persists.
    env:
      SCCACHE_GHA_ENABLED: "true"

    steps:
      # ---------------------------------------------------------------
      # Shallow checkout without recursive submodules. We init only the
      # submodules actually needed for the build, skipping heavy/unused
      # ones (LuaBridge3/ThirdParty nested submodules).
      # ---------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Init required submodules
        shell: bash
        run: |
          git submodule update --init --depth=1 \
            thirdparty/openvr \
            thirdparty/glm \
            thirdparty/Configuru \
            thirdparty/stb \
            thirdparty/fast-cpp-csv-parser \
            thirdparty/LuaBridge3 \
            thirdparty/imgui \
            thirdparty/imgui-node-editor \
            thirdparty/fast_obj \
            thirdparty/IXWebSocket \
            thirdparty/readerwriterqueue \
            thirdparty/nlohmann_json \
            thirdparty/Vulkan-Headers \
            thirdparty/volk
          # LuaBridge3 has its own sub-submodules we don't need, so skip them.

      # ---------------------------------------------------------------
      # sccache speeds up incremental builds by caching compiled object
      # files in the GitHub Actions cache. On a re-push that touches only
      # a few files this can cut 2-4 minutes off the build time.
      # ---------------------------------------------------------------
      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.9

      # ---------------------------------------------------------------
      # Cache the deps folder keyed on InitialSetup_x64.bat so that
      # the heavy downloads (OpenCV, CEF, SDL, etc.) are only fetched
      # on the first run or when the setup script changes.
      # GStreamer MSIs are excluded — they install system-wide and
      # can't be restored from a folder cache, and we skip them anyway
      # via SKIP_GSTREAMER since no test depends on GStreamer.
      # ---------------------------------------------------------------
      - name: Cache dependencies
        id: cache-deps
        uses: actions/cache@v4
        with:
          path: |
            deps
            !deps/*.msi
            !deps/*.exe
          key: deps-${{ runner.os }}-${{ hashFiles('InitialSetup_x64.bat') }}
          restore-keys: |
            deps-${{ runner.os }}-

      # ---------------------------------------------------------------
      # Only fetch deps on a cache miss. SKIP_GSTREAMER=1 tells
      # InitialSetup_x64.bat to skip the GStreamer MSI downloads and
      # installs — none of the test targets depend on GStreamer, and
      # skipping it saves several hundred MB of download on first run.
      # ---------------------------------------------------------------
      - name: Fetch dependencies
        if: steps.cache-deps.outputs.cache-hit != 'true'
        shell: cmd
        env:
          SKIP_GSTREAMER: "1"
        run: |
          call InitialSetup_x64.bat
          if %ERRORLEVEL% NEQ 0 (
            echo InitialSetup_x64.bat failed
            exit /b 1
          )

      # ---------------------------------------------------------------
      # Put the MSVC toolchain (cl.exe, link.exe, etc.) on PATH. The
      # Ninja generator invokes the compiler directly rather than going
      # through MSBuild, so it needs the dev environment exported. This
      # action writes the vcvars environment to $GITHUB_ENV so later
      # steps inherit it. arch: x64 matches our build target.
      # ---------------------------------------------------------------
      - name: Setup MSVC dev environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # ---------------------------------------------------------------
      # Configure the project. Key differences from a full local build:
      #   -DMIKAN_WITH_GSTREAMER=OFF  skips the GStreamer find_package
      #                               and the MikanGStreamerVideo plugin.
      #   -DCMAKE_RUNTIME_OUTPUT_DIRECTORY  flattens all EXEs and DLLs
      #                               to a single predictable location
      #                               (build\bin\) for the test steps
      #                               below.
      #
      # We use the Ninja generator (single-config) rather than the Visual
      # Studio generator specifically so sccache works: CMAKE_<LANG>_
      # COMPILER_LAUNCHER is only honored by Ninja/Makefile generators,
      # not by the VS/MSBuild generator. Because Ninja is single-config,
      # the build type is fixed at configure time via CMAKE_BUILD_TYPE
      # and there is no per-config (\Release) output subdirectory.
      # ---------------------------------------------------------------
      - name: Generate project files
        shell: cmd
        run: |
          IF NOT EXIST build mkdir build
          pushd build

          set DEPS_ROOT_PATH=%GITHUB_WORKSPACE%\deps
          set THIRDPARTY_ROOT_PATH=%GITHUB_WORKSPACE%\thirdparty
          set DIST_ROOT_PATH=%GITHUB_WORKSPACE%\dist\Win64

          cmake .. -G "Ninja" ^
            -DCMAKE_BUILD_TYPE=Release ^
            -DCMAKE_INSTALL_PREFIX=%DIST_ROOT_PATH% ^
            -DCEF_ROOT="%DEPS_ROOT_PATH%/cef/cef_binary_145.0.27+g4ddda2e+chromium-145.0.7632.117_windows64" ^
            -DOpenCV_DIR=%DEPS_ROOT_PATH%\opencv\build ^
            -DOPENVR_ROOT_DIR=%THIRDPARTY_ROOT_PATH%\openvr ^
            -DOPENVR_HEADERS_ROOT_DIR=%THIRDPARTY_ROOT_PATH%\openvr\include ^
            -DSDL2_LIBRARY="%DEPS_ROOT_PATH%\SDL2-2.30.10\lib\x64\sdl2.lib" ^
            -DSDL2_INCLUDE_DIR="%DEPS_ROOT_PATH%\SDL2-2.30.10\include" ^
            -DSDL2TTF_LIBRARY="%DEPS_ROOT_PATH%\SDL2_ttf-2.24.0\lib\x64\sdl2_ttf.lib" ^
            -DSDL2TTF_INCLUDE_DIR="%DEPS_ROOT_PATH%\SDL2_ttf-2.24.0\include" ^
            -DSDL2_IMAGE_LIBRARY="%DEPS_ROOT_PATH%\SDL2_image-2.8.8\lib\x64\sdl2_image.lib" ^
            -DSDL2_IMAGE_INCLUDE_DIR="%DEPS_ROOT_PATH%\SDL2_image-2.8.8\include" ^
            -DCMAKE_PREFIX_PATH="%DEPS_ROOT_PATH%\easy_profiler\lib\cmake\easy_profiler" ^
            -DNUGET_PATH="%DEPS_ROOT_PATH%" ^
            -DMIKAN_WITH_GSTREAMER=OFF ^
            -DCMAKE_RUNTIME_OUTPUT_DIRECTORY="%GITHUB_WORKSPACE%\build\bin" ^
            -DCMAKE_C_COMPILER_LAUNCHER=sccache ^
            -DCMAKE_CXX_COMPILER_LAUNCHER=sccache ^
            -DCEF_DEBUG_INFO_FLAG=/Z7 ^
            -DCMAKE_UNITY_BUILD=ON

          if %ERRORLEVEL% NEQ 0 (
            echo CMake configure failed
            exit /b 1
          )
          popd

      # ---------------------------------------------------------------
      # Build each test target separately so failures are reported
      # per-target. MikanCmd depends on Mikan (add_dependencies), so
      # the full editor object library is compiled once here and reused
      # by the other targets through the shared output directory.
      # ---------------------------------------------------------------
      - name: Build MikanCmd
        shell: cmd
        run: |
          cmake --build build --target MikanCmd --parallel
          if %ERRORLEVEL% NEQ 0 (
            echo MikanCmd build failed
            exit /b 1
          )

      - name: Build unit_test_suite_cpp
        shell: cmd
        run: |
          cmake --build build --target unit_test_suite_cpp --parallel
          if %ERRORLEVEL% NEQ 0 (
            echo unit_test_suite_cpp build failed
            exit /b 1
          )

      # ---------------------------------------------------------------
      # Print sccache stats so cache hit/miss behavior is visible in the
      # run logs. After the first run populates the GHA cache, subsequent
      # runs should show a non-zero "Cache hits" count here.
      # ---------------------------------------------------------------
      - name: Show sccache stats
        shell: cmd
        run: sccache --show-stats

      # ---------------------------------------------------------------
      # List the folder and dump every binary's imports for missing DLL
      # diagnostics in case of a build failure
      # ---------------------------------------------------------------
      - name: Emit build\bin dependencies
        shell: cmd
        run: |
          echo ===== build\bin contents =====
          dir /b build\bin
          echo ===== imports of each binary =====
          for %%F in (build\bin\*.exe build\bin\*.dll) do (
            echo --- %%~nxF ---
            dumpbin /dependents "%%F" | findstr /i "\.dll"
          )
          exit /b 0

      # ---------------------------------------------------------------
      # Run tests. All binaries land in build\bin\ thanks to
      # CMAKE_RUNTIME_OUTPUT_DIRECTORY set during configure (no per-config
      # subdirectory because Ninja is single-config).
      # ---------------------------------------------------------------
      # MikanCmd writes test details to MikanCmd.log (in addition to the
      # console). Dump that log and the actual exit code afterward so a
      # failure shows which assertion failed (clean failure) or crashed
      # (no flushed output, nonzero crash code like 0xC0000005).
      - name: Run MikanCmd tests
        shell: cmd
        run: |
          build\bin\MikanCmd.exe -runTests
          set TEST_EXIT=%ERRORLEVEL%
          echo ===== MikanCmd.log =====
          if exist MikanCmd.log type MikanCmd.log
          echo ========================
          if %TEST_EXIT% NEQ 0 (
            echo MikanCmd tests failed with exit code %TEST_EXIT%
            exit /b 1
          )

      - name: Run C++ unit tests
        shell: cmd
        run: |
          build\bin\unit_test_suite_cpp.exe
          if %ERRORLEVEL% NEQ 0 (
            echo C++ unit tests failed
            exit /b 1
          )
      # ---------------------------------------------------------------
      # Crash the command-line tool on purpose and require the crash
      # reporter's files. A nonzero exit is the expected outcome here:
      # a zero exit means the crash never happened. The stack overflow
      # kind is the one that needs the reporter's writer thread, so it
      # runs too.
      # ---------------------------------------------------------------
      - name: Check crash reporter
        shell: cmd
        run: |
          setlocal EnableDelayedExpansion
          for %%K in (access stackoverflow) do (
            if exist build\crash rmdir /s /q build\crash
            build\bin\MikanCmd.exe -crash=%%K -crashReportDir=build\crash
            if !ERRORLEVEL! EQU 0 (
              echo MikanCmd did not crash on kind %%K
              exit /b 1
            )
            if not exist build\crash\*.dmp (
              echo No minidump written for kind %%K
              exit /b 1
            )
            if not exist build\crash\*.txt (
              echo No crash summary written for kind %%K
              exit /b 1
            )
            type build\crash\*.txt
          )
          exit /b 0


      # Upload test binaries and runtime DLLs for inspection.
      # Only upload on main branch pushes to avoid wasting storage on
      # every feature-branch commit (~18s savings per branch push).
      - name: Upload build artifacts
        if: always() && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: MikanXR-TestBinaries
          path: build\bin\
          retention-days: 7
