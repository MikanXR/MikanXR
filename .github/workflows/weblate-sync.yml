name: Weblate Sync

# Weblate commits translator edits to the gettext catalogs under localization/
# and pushes them to the `weblate` branch. It cannot run repo scripts, so the
# JSON tables under resources/localization/ that the app loads and the CDN
# serves are stale on that branch, and a pull request made from it would fail
# localization-check.
#
# This workflow builds the branch a pull request can be made from: `weblate`
# plus one commit that regenerates the tables, force-pushed to `weblate-sync`.
# Two branches because Weblate rebases its pending commits whenever main moves
# and force-pushes the result, which would discard a commit added to `weblate`
# here. So Weblate is the only writer of `weblate` and this workflow is the only
# writer of `weblate-sync`.
#
# The push and the pull request are made with the WEBLATE_SYNC_TOKEN secret, a
# personal access token, not the workflow's own token. GitHub starts no
# workflow for anything the workflow token does, so the checks main requires
# would never run on the pull request.
#
# The pull request is merged with a merge commit, never squashed: Weblate
# rebases onto main after the merge and needs to find its own commits there.
#
# A manual run rebuilds `weblate-sync` from the current `weblate` branch.
on:
  push:
    branches: [ weblate ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: weblate-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.WEBLATE_SYNC_TOKEN }}
    steps:
      - name: Check the token is configured
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::the WEBLATE_SYNC_TOKEN secret is missing or empty"
            exit 1
          fi

      # The token given here is the one the push below is made with
      - name: Checkout the weblate branch
        uses: actions/checkout@v4
        with:
          ref: weblate
          fetch-depth: 0
          submodules: false
          token: ${{ secrets.WEBLATE_SYNC_TOKEN }}

      # Weblate writes the gettext catalogs and nothing else. A commit on this
      # branch that touches any other file did not come from a translator, so
      # nothing is published and the open pull request keeps its last state.
      - name: Check the branch changes only the catalogs
        run: |
          unexpected=$(git diff --name-only origin/main...HEAD | grep -v -E '^localization/[^/]+[.]po$' || true)
          if [ -n "$unexpected" ]; then
            echo "::error::the weblate branch changes files other than localization/*.po"
            echo "$unexpected"
            exit 1
          fi

      - name: Install polib
        run: pip install -r tools/requirements.txt

      # A string that breaks a rule fails here, before anything is pushed, and
      # the log names the key. The open pull request keeps its last good state.
      - name: Regenerate localization tables
        run: python tools/localization.py sync

      - name: Push weblate-sync
        id: push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add localization resources/localization
          if ! git diff --cached --quiet; then
            git commit -m "Localization tables regenerated from the Weblate catalogs"
          fi

          # Nothing to do when the published branch already holds this tree on
          # top of the current weblate history.
          if git rev-parse --verify --quiet origin/weblate-sync >/dev/null \
            && [ "$(git rev-parse 'HEAD^{tree}')" = "$(git rev-parse 'origin/weblate-sync^{tree}')" ] \
            && git merge-base --is-ancestor origin/weblate origin/weblate-sync; then
            echo "weblate-sync is already current"
          else
            git push --force origin HEAD:refs/heads/weblate-sync
          fi

          if git diff --quiet origin/main HEAD; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open the pull request if none is open
        if: steps.push.outputs.has_changes == 'true'
        run: |
          if [ -z "$(gh pr list --head weblate-sync --base main --state open --json number --jq '.[].number')" ]; then
            gh pr create --head weblate-sync --base main \
              --title "Translations from Weblate" \
              --body "Translator edits from Weblate, with the localization tables regenerated. Merge with a merge commit, not a squash: Weblate rebases onto main afterwards and needs to find its own commits there."
          fi
